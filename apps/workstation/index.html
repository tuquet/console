<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta
      name="description"
      content="- Unified Management & Operations Console (console.operon.com)"
    />
    <meta
      name="keywords"
      content="Specter, Console, IAM, Tenants, Fleets, Operon"
    />
    <meta name="author" content="Operon" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=0"
    />
    <!-- Injected by vite from VITE_APP_TITLE in .env -->
    <title>%VITE_APP_TITLE%</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Admin" />
    <!-- Google tag (gtag.js) - only active in production to prevent tracking & storage blocking in dev -->
    <script>
      (function () {
        if (
          location.hostname !== 'localhost' &&
          location.hostname !== '127.0.0.1' &&
          !location.hostname.endsWith('.local')
        ) {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-HM8RJDZ15Q';
          document.head.appendChild(s);
          window.dataLayer = window.dataLayer || [];
          function gtag() {
            dataLayer.push(arguments);
          }
          window.gtag = gtag;
          gtag('js', new Date());
          gtag('config', 'G-HM8RJDZ15Q');
        } else {
          // No-op mock for dev environment to avoid undefined reference errors
          window.dataLayer = window.dataLayer || [];
          window.gtag = function () {};
        }
      })();
    </script>
    <style>
      html,
      body {
        font-family: var(
          --font-family,
          'Inter',
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Helvetica Neue',
          Arial,
          sans-serif
        );
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
