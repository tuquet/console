name: Setup desktop build environment
description: Checkout pinned Operon subsystem, configure Node/pnpm/Rust toolchains, and restore build caches

inputs:
  operon-deploy-key:
    description: SSH deploy key used to checkout tuquet/operon
    required: true
  save-cache:
    description: Whether to save Cargo build cache at job completion
    required: false
    default: 'false'
  cache-bundler-tools:
    description: Whether to restore and save Tauri bundler tools (NSIS/WiX)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Read build pins
      id: pins
      shell: pwsh
      run: |
        "revision=$((Get-Content console/subsystem.json -Raw | ConvertFrom-Json).revision)" >> $env:GITHUB_OUTPUT
        "rust=$((Get-Content console/release/config.json -Raw | ConvertFrom-Json).rustToolchain)" >> $env:GITHUB_OUTPUT
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: tuquet/operon
        ref: ${{ steps.pins.outputs.revision }}
        ssh-key: ${{ inputs.operon-deploy-key }}
        path: operon
        persist-credentials: false
    - name: Normalize pinned operon file timestamps for Cargo cache
      shell: pwsh
      run: |
        $commitTime = [DateTimeOffset]::Parse((git -C operon show -s --format=%cI HEAD)).UtcDateTime
        Get-ChildItem -Path operon -Force | Where-Object { $_.Name -ne '.git' } | Get-ChildItem -Recurse -File -Force | ForEach-Object { $_.LastWriteTimeUtc = $commitTime }
        Get-ChildItem -Path operon -File -Force | ForEach-Object { $_.LastWriteTimeUtc = $commitTime }
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        package_json_file: console/package.json
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: console/.node-version
        cache: pnpm
        cache-dependency-path: console/pnpm-lock.yaml
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: ${{ steps.pins.outputs.rust }}
        targets: x86_64-pc-windows-msvc
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        workspaces: console/apps/shell/src-tauri -> target
        shared-key: windows-desktop-x64
        cache-workspace-crates: true
        key: operon-${{ steps.pins.outputs.revision }}
        save-if: ${{ inputs.save-cache }}
    - name: Cache Tauri bundler tools
      if: inputs.cache-bundler-tools == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/AppData/Local/tauri
        key: windows-tauri-tools-nsis-v1
    - name: Install locked frontend dependencies
      working-directory: console
      shell: pwsh
      run: pnpm install --frozen-lockfile
