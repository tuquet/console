name: "Release: prepare"

on:
  workflow_dispatch:
    inputs:
      version:
        description: New product version, e.g. 5.8.1 or 5.9.0-beta.1
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: prepare-product-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Create version PR and start quality checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          LEFTHOOK: '0'
        run: node scripts/release/prepare-pr.mjs
