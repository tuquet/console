name: PR Preview Build

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build PR Preview Test Binary
    runs-on: windows-latest
    steps:
      - name: Setup SSH Agent for Operon Subsystem
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OPERON_DEPLOY_KEY }}

      - name: Checkout Console Repository
        uses: actions/checkout@v4
        with:
          path: console

      - name: Checkout Operon Subsystem (Private)
        uses: actions/checkout@v4
        with:
          repository: tuquet/operon
          ssh-key: ${{ secrets.OPERON_DEPLOY_KEY }}
          path: operon

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Rust Toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            console/apps/workstation/src-tauri -> target
            operon -> target

      - name: Install Frontend Dependencies
        working-directory: console
        run: pnpm install --frozen-lockfile

      - name: Quality Gate (Typecheck & Unit Tests)
        working-directory: console
        run: |
          pnpm --filter @operon/workstation typecheck
          pnpm vitest run apps/workstation/src/db/__tests__

      - name: Build Tauri Desktop Bundle
        working-directory: console/apps/workstation
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          OPERON_SKIP_WINRES: "1"
        run: pnpm tauri:build:exe

      - name: Package Distribution Artifacts
        working-directory: console
        run: node scripts/package-portable.mjs

      - name: Upload PR Test Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Operon-Workstation-PR-${{ github.event.pull_request.number || github.sha }}
          path: console/dist-release/
          retention-days: 7
